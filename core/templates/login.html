{% extends 'base.html' %}
{% block content %}
<h2>Teacher Login</h2>
<form method="post">
    {% csrf_token %}
    <label>Name: <input type="text" name="name"></label><br>
    <label>ID Number: <input type="text" name="id_number"></label><br>
    <button type="submit">Login</button>
</form>
{% if error %}
<p style="color: red;">{{ error }}</p>
{% endif %}
{% endblock %}
